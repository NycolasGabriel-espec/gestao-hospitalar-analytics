<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f7">
  <title>Acessar — Hospital Analytics</title>
  <style>
    :root{font-family:Inter,"DM Sans",system-ui,-apple-system,sans-serif;color:#102d3a;background:#f6f8f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:#fff;border:1px solid #dce5e2;border-radius:12px;padding:38px;box-shadow:0 22px 60px #102d3a12}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.04em}.mark{height:34px;width:34px;border-radius:10px;background:#137c70;color:#fff;display:grid;place-items:center;font-size:22px}.eyebrow{margin:32px 0 9px;color:#137c70;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:750}h1{font-size:30px;letter-spacing:-.055em;margin:0}p{font-size:14px;color:#60737a;line-height:1.6;margin:10px 0 26px}label{display:block;font-size:12px;font-weight:650;margin:17px 0 7px}input{width:100%;height:46px;border:1px solid #dce5e2;border-radius:6px;padding:0 12px;font:inherit;color:#102d3a}input:focus{outline:2px solid #137c7040;border-color:#137c70}button{width:100%;height:47px;margin-top:21px;border:0;border-radius:6px;background:#137c70;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.switch{display:block;margin:19px auto 0;background:none;color:#137c70;height:auto;font-size:12px}.message{min-height:20px;margin:14px 0 0;color:#9a4b32;font-size:12px}.back{display:block;margin-top:24px;color:#60737a;font-size:12px;text-align:center;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark" aria-hidden="true">+</span>hospital analytics</div>
    <div class="eyebrow">Acesso seguro</div>
    <h1 id="heading">Entre na sua conta</h1>
    <p id="intro">Entre com uma conta habilitada pela equipe responsável.</p>
    <form id="auth-form">
      <div id="email-field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required></div>
      <label id="password-label" for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required>
      <div id="confirm-password-field" hidden><label for="confirm-password">Confirme a nova senha</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="1024"></div>
      <button id="submit" type="submit">Entrar</button>
    </form>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">Voltar ao início</a>
  </main>
  <script type="module">
    const form = document.querySelector('#auth-form');
    const message = document.querySelector('#message');
    const submit = document.querySelector('#submit');
    const emailField = document.querySelector('#email-field');
    const passwordLabel = document.querySelector('#password-label');
    const confirmPasswordField = document.querySelector('#confirm-password-field');
    const confirmPassword = document.querySelector('#confirm-password');
    const authParams = new URLSearchParams(location.hash.slice(1));
    const confirmedAccessToken = authParams.get('access_token');
    const recovery = authParams.get('type') === 'recovery';

    function showPasswordRecovery() {
      document.querySelector('#heading').textContent = 'Defina sua nova senha';
      document.querySelector('#intro').textContent = 'Escolha uma senha com pelo menos 8 caracteres.';
      emailField.hidden = true;
      form.email.required = false;
      passwordLabel.textContent = 'Nova senha';
      form.password.autocomplete = 'new-password';
      confirmPasswordField.hidden = false;
      confirmPassword.required = true;
      submit.textContent = 'Salvar nova senha';
      form.dataset.mode = 'recovery';
    }

    if (confirmedAccessToken) {
      history.replaceState(null, '', location.pathname);
      if (!authParams.get('refresh_token')) {
        message.textContent = 'Não foi possível concluir a confirmação. Entre com sua conta.';
      } else {
      fetch('/api/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          access_token: confirmedAccessToken,
          refresh_token: authParams.get('refresh_token'),
          expires_in: Number(authParams.get('expires_in')) || 3600,
        }),
      }).then(async (response) => {
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Esta conta não está habilitada para acessar os dados.');
        if (recovery) {
          showPasswordRecovery();
          message.style.color = '#137c70';
          message.textContent = 'Link confirmado. Agora defina sua nova senha.';
        } else {
          location.assign('/powerbi/dashboard_preview.html');
        }
      }).catch((error) => { message.textContent = error.message; });
      }
    } else if (recovery) {
      history.replaceState(null, '', location.pathname);
      message.textContent = 'Link de recuperação inválido ou expirado. Solicite um novo e-mail.';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      message.textContent = '';
      try {
        if (form.dataset.mode === 'recovery') {
          const password = form.password.value;
          if (password !== confirmPassword.value) throw new Error('As senhas não coincidem.');
          const response = await fetch('/api/auth/update-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Não foi possível atualizar a senha.');
          location.assign('/powerbi/dashboard_preview.html');
          return;
        }
        const email = form.email.value.trim();
        const password = form.password.value;
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Não foi possível autenticar.');
        location.assign('/powerbi/dashboard_preview.html');
      } catch (error) {
        message.style.color = '#9a4b32';
        message.textContent = error.message;
      } finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
