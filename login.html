<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f5">
  <meta name="description" content="Acesso autorizado ao painel Hospital Analytics.">
  <title>Acessar — Hospital Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    body.login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); }
    .auth-card { width: min(100%, 440px); padding: 34px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); box-shadow: 0 18px 44px rgb(16 42 49 / 8%); }
    .auth-card .brand { margin-bottom: 29px; }
    .auth-card .eyebrow { margin: 0 0 9px; color: var(--teal-dark); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .auth-card h1 { margin: 0; color: var(--ink-strong); font: 700 28px/1.2 var(--display); letter-spacing: -.05em; }
    .auth-intro { margin: 9px 0 23px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .auth-card label { display: block; margin: 15px 0 6px; color: var(--ink-soft); font-size: 11px; font-weight: 700; }
    .auth-card input { width: 100%; height: 43px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 4px; background: #fff; color: var(--ink-strong); font: 12px var(--font); }
    .auth-card input:focus { outline: 3px solid rgb(20 121 109 / 18%); border-color: var(--teal); }
    .auth-submit { width: 100%; min-height: 43px; margin-top: 20px; border: 1px solid var(--teal); border-radius: 4px; background: var(--teal); color: #fff; font: 700 12px var(--font); cursor: pointer; transition: background .16s ease, border-color .16s ease; }
    .auth-submit:hover { border-color: var(--teal-dark); background: var(--teal-dark); }
    .auth-submit:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 18px; margin: 13px 0 0; color: #93463b; font-size: 11px; line-height: 1.5; }
    .back { display: block; margin-top: 20px; color: var(--muted); font-size: 11px; text-align: center; text-decoration: underline; text-underline-offset: 3px; }
    .back:hover { color: var(--teal-dark); }
    @media (max-width: 420px) { body.login-page { padding: 16px; } .auth-card { padding: 25px 21px; } }
  </style>
</head>
<body class="login-page">
  <main class="auth-card">
    <a class="brand" href="/" aria-label="Hospital Analytics, voltar ao início"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span><span>hospital <b>analytics</b></span></a>
    <div class="eyebrow">Acesso seguro</div>
    <h1>Entre na sua conta</h1>
    <p class="auth-intro">Use o e-mail e a senha da sua conta autorizada para acessar o dashboard.</p>
    <form id="auth-form">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required>
      <button class="auth-submit" id="submit" type="submit">Entrar no dashboard</button>
    </form>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">Voltar ao início</a>
  </main>
  <script type="module">
    const form = document.querySelector('#auth-form');
    const message = document.querySelector('#message');
    const submit = document.querySelector('#submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Não foi possível entrar. Confira suas credenciais.');
        location.assign('/powerbi/dashboard_preview.html');
      } catch (error) {
        message.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
