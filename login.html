<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f7">
  <title>Acessar — Hospital Analytics</title>
  <style>
    :root{font-family:Inter,"DM Sans",system-ui,-apple-system,sans-serif;color:#102d3a;background:#f6f8f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:#fff;border:1px solid #dce5e2;border-radius:12px;padding:38px;box-shadow:0 22px 60px #102d3a12}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.04em}.mark{height:34px;width:34px;border-radius:10px;background:#137c70;color:#fff;display:grid;place-items:center;font-size:22px}.eyebrow{margin:32px 0 9px;color:#137c70;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:750}h1{font-size:30px;letter-spacing:-.055em;margin:0}p{font-size:14px;color:#60737a;line-height:1.6;margin:10px 0 26px}label{display:block;font-size:12px;font-weight:650;margin:17px 0 7px}input{width:100%;height:46px;border:1px solid #dce5e2;border-radius:6px;padding:0 12px;font:inherit;color:#102d3a}input:focus{outline:2px solid #137c7040;border-color:#137c70}button{width:100%;height:47px;margin-top:21px;border:0;border-radius:6px;background:#137c70;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.switch{display:block;margin:19px auto 0;background:none;color:#137c70;height:auto;font-size:12px}.message{min-height:20px;margin:14px 0 0;color:#9a4b32;font-size:12px}.back{display:block;margin-top:24px;color:#60737a;font-size:12px;text-align:center;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark" aria-hidden="true">+</span>hospital analytics</div>
    <div class="eyebrow">Acesso seguro</div>
    <h1 id="heading">Entre na sua conta</h1>
    <p id="intro">Use seu e-mail e senha para acessar os dados analíticos protegidos.</p>
    <form id="auth-form">
      <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <button id="submit" type="submit">Entrar</button>
    </form>
    <button class="switch" id="switch" type="button">Criar uma conta</button>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">Voltar ao início</a>
  </main>
  <script type="module">
    const form = document.querySelector('#auth-form');
    const message = document.querySelector('#message');
    const submit = document.querySelector('#submit');
    let signingUp = false;
    const authParams = new URLSearchParams(location.hash.slice(1));
    const confirmedAccessToken = authParams.get('access_token');
    if (confirmedAccessToken) {
      localStorage.setItem('hospital-auth-session', JSON.stringify({
        access_token: confirmedAccessToken,
        refresh_token: authParams.get('refresh_token'),
        expires_at: Number(authParams.get('expires_at')) || Math.floor(Date.now() / 1000) + Number(authParams.get('expires_in') || 3600),
      }));
      history.replaceState(null, '', location.pathname);
      location.assign('/powerbi/dashboard_preview.html');
    }
    document.querySelector('#switch').addEventListener('click', () => {
      signingUp = !signingUp;
      document.querySelector('#heading').textContent = signingUp ? 'Crie sua conta' : 'Entre na sua conta';
      document.querySelector('#intro').textContent = signingUp ? 'Cadastre seu e-mail para começar a usar a plataforma.' : 'Use seu e-mail e senha para acessar os dados analíticos protegidos.';
      submit.textContent = signingUp ? 'Criar conta' : 'Entrar';
      document.querySelector('#switch').textContent = signingUp ? 'Já tenho uma conta' : 'Criar uma conta';
      document.querySelector('#password').autocomplete = signingUp ? 'new-password' : 'current-password';
      message.textContent = '';
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      message.textContent = '';
      try {
        const configResponse = await fetch('/api/config', { cache: 'no-store' });
        const config = await configResponse.json();
        if (!configResponse.ok) throw new Error(config.error || 'Não foi possível carregar a configuração.');
        const email = form.email.value.trim();
        const password = form.password.value;
        const path = signingUp
          ? `/auth/v1/signup?redirect_to=${encodeURIComponent(`${location.origin}/login.html`)}`
          : '/auth/v1/token?grant_type=password';
        const response = await fetch(`${config.url}${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: config.publishableKey },
          body: JSON.stringify({ email, password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.msg || result.message || result.error_description || 'Não foi possível autenticar.');
        if (signingUp && !result.access_token) {
          message.style.color = '#137c70';
          message.textContent = 'Confira seu e-mail para confirmar a conta e depois entre.';
        } else {
          localStorage.setItem('hospital-auth-session', JSON.stringify({ access_token: result.access_token, refresh_token: result.refresh_token, expires_at: Math.floor(Date.now()/1000) + result.expires_in }));
          location.assign('/powerbi/dashboard_preview.html');
        }
      } catch (error) {
        message.style.color = '#9a4b32';
        message.textContent = error.message;
      } finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
